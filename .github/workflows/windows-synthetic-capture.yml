name: SYNTHETIC Forza capture on verified v1.2.3

on:
  push:
    branches:
      - codex/purple-nrf-calibration-2026-10-27
    paths:
      - .github/workflows/windows-synthetic-capture.yml
      - tools/Test-SyntheticForzaCapture.ps1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic-capture:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download the already verified executable without rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40945648200 --repo '${{ github.repository }}' `
            --name 'VFORCE-Purple-NRF-v1.2.3-2026.10.29' --dir 'work\verified-v123'

      - name: Capture an external SYNTHETIC UDP fixture with USB closed
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'work\verified-v123\VFORCE-Purple-NRF-v1.2.3-2026.10.29\VestibularJoystickSim.exe'
          .\tools\Test-SyntheticForzaCapture.ps1 -ExecutablePath $exe `
            -OutputDirectory (Join-Path $PWD 'outputs\SYNTHETIC-forza-capture-v1.2.3')

      - name: Upload SYNTHETIC evidence, never live game data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYNTHETIC-Forza-capture-verified-v1.2.3
          if-no-files-found: error
          path: outputs/SYNTHETIC-forza-capture-v1.2.3/
