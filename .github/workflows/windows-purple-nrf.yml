name: Purple NRF Windows build

on:
  push:
    branches:
      - codex/purple-nrf-calibration-2026-10-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run device-free tests
        shell: pwsh
        run: .\build.ps1

      - name: Check handheld layout and capture UI
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'outputs\vestibular-joystick-sim\VestibularJoystickSim.exe'
          $screenshots = Join-Path $PWD 'outputs\ui-smoke'
          New-Item -ItemType Directory -Force -Path $screenshots | Out-Null
          $test = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test', $screenshots -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "UI smoke test failed: $($test.ExitCode)" }

      - name: Verify telemetry capture keeps USB closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'outputs\vestibular-joystick-sim\VestibularJoystickSim.exe'
          $captureDir = Join-Path $PWD 'outputs\capture-smoke'
          New-Item -ItemType Directory -Force -Path $captureDir | Out-Null
          $csv = Join-Path $captureDir 'forza-quiet.csv'
          $capture = Start-Process -FilePath $exe -ArgumentList '--capture-telemetry', 'forza', '--seconds', '2', '--out', $csv -PassThru
          if (-not $capture.WaitForExit(20000)) {
            $capture.Kill()
            throw 'Telemetry capture did not finish within 20 seconds.'
          }
          if ($capture.ExitCode -ne 0) { throw "Telemetry capture failed: $($capture.ExitCode)" }
          if (-not (Test-Path -LiteralPath $csv)) { throw 'Capture CSV was not created.' }
          $summary = Get-Content -LiteralPath "$csv.summary.json" -Raw | ConvertFrom-Json
          if ($summary.scope -ne 'shadow_telemetry_preview_no_usb' -or $summary.source -ne 'forza') {
            throw 'Unexpected capture mode or source.'
          }
          if ($summary.rows -le 0 -or $summary.fresh_rows -ne 0) {
            throw 'Quiet capture should contain samples and zero fresh game samples.'
          }
          if ($summary.usb_open_count -ne 0 -or $summary.actual_packets_sent -ne 0 -or
              $summary.serial_connected -ne $false -or $summary.armed -ne $false -or $null -ne $summary.error) {
            throw 'Non-actuating capture invariants failed.'
          }
          $rows = @(Import-Csv -LiteralPath $csv)
          if ($rows.Count -ne $summary.rows) { throw 'CSV row count does not match capture summary.' }
          $headers = $rows[0].PSObject.Properties.Name
          $required = @('utc', 'native_timestamp_ms', 'raw_prefix_hex',
            'body_p_rad_s', 'body_q_rad_s', 'body_r_rad_s',
            'aligned_command_p_rad_s', 'aligned_command_q_rad_s', 'aligned_command_r_rad_s',
            'nominal_preview_a_mA', 'nominal_preview_b_mA', 'nominal_preview_c_mA', 'nominal_preview_d_mA',
            'preview_byte_a', 'preview_byte_b', 'preview_byte_c', 'preview_byte_d',
            'preview_packet_hex', 'actual_packets_sent', 'serial_connected', 'armed')
          foreach ($column in $required) {
            if ($column -notin $headers) { throw "Capture CSV is missing column: $column" }
          }
          foreach ($row in $rows) {
            if ($row.fresh -ne 'false' -or $row.actual_packets_sent -ne '0' -or
                $row.serial_connected -ne 'false' -or $row.armed -ne 'false') {
              throw 'A quiet capture row reports fresh data or an active output path.'
            }
            if ($row.preview_byte_a -ne '128' -or $row.preview_byte_b -ne '128' -or
                $row.preview_byte_c -ne '128' -or $row.preview_byte_d -ne '128' -or
                $row.preview_packet_hex -ne 'AA-05-0A-80-80-80-80-0A-55') {
              throw 'A quiet capture row must contain an exact neutral packet preview.'
            }
          }
          Get-Content -LiteralPath "$csv.summary.json"
          $validation = 'PASS quiet Forza capture: CSV schema and row count checked, exact neutral packet previews, no live game samples, USB opens=0, transmitted packets=0, disconnected and disarmed.'
          $validation | Set-Content -Encoding utf8 (Join-Path $captureDir 'validation.txt')
          Write-Host $validation

      - name: Validate fresh SYNTHETIC Forza capture against PDF directions
        shell: pwsh
        run: |
          $buildDir = Join-Path $PWD 'outputs\vestibular-joystick-sim'
          $exe = Join-Path $buildDir 'VestibularJoystickSim.exe'
          "source_commit=$env:GITHUB_SHA`nworkflow_run=$env:GITHUB_RUN_ID`nfirmware_target=vmocion-classic-firmware/v0.8.1`nfirmware_modified=false`nrecommended_fast_firmware=classic_r8_2_fast100_bench" |
            Set-Content -Encoding utf8 (Join-Path $buildDir 'BUILD-INFO.txt')
          $expectedHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          .\tools\Test-SyntheticForzaCapture.ps1 -ExecutablePath $exe `
            -OutputDirectory (Join-Path $PWD 'outputs\capture-smoke\SYNTHETIC') `
            -ExpectedExeSha256 $expectedHash -ExpectedSourceCommit $env:GITHUB_SHA `
            -ExpectedBuildRunId $env:GITHUB_RUN_ID

      - name: Package executable, runtime dependency and instructions
        shell: pwsh
        run: |
          $name = 'VFORCE-Purple-NRF-v1.2.7-2026.10.30'
          $package = Join-Path $PWD "outputs\$name"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'outputs\vestibular-joystick-sim\VestibularJoystickSim.exe' $package
          Copy-Item 'outputs\vestibular-joystick-sim\SimConnect.dll' $package
          Copy-Item 'outputs\vestibular-joystick-sim\ReadBoardStatus.exe' $package
          Copy-Item 'outputs\vestibular-joystick-sim\board-diagnostic-self-test.txt' $package
          Copy-Item README.md (Join-Path $package 'READ-ME-FIRST.md')
          Copy-Item 'outputs\vestibular-joystick-sim\self-test-results.txt' $package
          Copy-Item 'outputs\vestibular-joystick-sim\BUILD-INFO.txt' $package
          Get-ChildItem -LiteralPath $package -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $package 'SHA256SUMS.txt')
          Compress-Archive -Path "$package\*" -DestinationPath "outputs\$name.zip" -Force

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: VFORCE-Purple-NRF-v1.2.7-2026.10.30
          if-no-files-found: error
          path: |
            outputs/VFORCE-Purple-NRF-v1.2.7-2026.10.30.zip
            outputs/VFORCE-Purple-NRF-v1.2.7-2026.10.30/

      - name: Upload UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VFORCE-Purple-NRF-v1.2.7-2026.10.30-UI-check
          if-no-files-found: warn
          path: outputs/ui-smoke/

      - name: Upload non-actuating capture verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VFORCE-Purple-NRF-v1.2.7-2026.10.30-Capture-check
          if-no-files-found: warn
          path: outputs/capture-smoke/
