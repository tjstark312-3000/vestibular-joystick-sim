name: Purple NRF Windows build

on:
  push:
    branches:
      - codex/purple-nrf-calibration-2026-10-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run device-free tests
        shell: pwsh
        run: .\build.ps1

      - name: Prepare a desktop large enough for handheld UI checks
        shell: pwsh
        run: |
          # The hosted runner can start at 1024x768. Windows clamps a real
          # top-level window to that desktop even when ClientSize is larger.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class UiTestDisplay {
            [StructLayout(LayoutKind.Explicit, Size = 220)]
            public struct Mode {
              [FieldOffset(68)] public ushort Size;
              [FieldOffset(70)] public ushort DriverExtra;
              [FieldOffset(72)] public uint Fields;
              [FieldOffset(172)] public uint Width;
              [FieldOffset(176)] public uint Height;
            }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern bool EnumDisplaySettingsW(string device, int index, ref Mode mode);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern int ChangeDisplaySettingsW(ref Mode mode, uint flags);
            [DllImport("user32.dll")]
            public static extern int GetSystemMetrics(int index);
          }
          '@
          $current = [UiTestDisplay+Mode]::new()
          $current.Size = 220
          if (-not [UiTestDisplay]::EnumDisplaySettingsW($null, -1, [ref] $current)) {
            throw 'Cannot read the Windows runner display mode.'
          }
          $before = '{0}x{1}' -f [UiTestDisplay]::GetSystemMetrics(0), [UiTestDisplay]::GetSystemMetrics(1)
          Write-Host "Runner desktop before UI checks: $before"
          $attempts = [System.Collections.Generic.List[string]]::new()
          foreach ($dimensions in @(@(1920,1080), @(1600,1200), @(1600,900), @(1440,900))) {
            $mode = $current
            $mode.Size = 220
            $mode.DriverExtra = 0
            $mode.Fields = 0x180000 # DM_PELSWIDTH | DM_PELSHEIGHT
            $mode.Width = $dimensions[0]
            $mode.Height = $dimensions[1]
            $testResult = [UiTestDisplay]::ChangeDisplaySettingsW([ref] $mode, 2) # CDS_TEST
            if ($testResult -ne 0) {
              $attempts.Add("$($mode.Width)x$($mode.Height): test=$testResult")
              continue
            }
            $result = [UiTestDisplay]::ChangeDisplaySettingsW([ref] $mode, 0)
            $attempts.Add("$($mode.Width)x$($mode.Height): apply=$result")
            if ($result -eq 0) {
              Start-Sleep -Milliseconds 500
              if ([UiTestDisplay]::GetSystemMetrics(0) -ge 1440 -and [UiTestDisplay]::GetSystemMetrics(1) -ge 900) {
                break
              }
            }
          }
          $width = [UiTestDisplay]::GetSystemMetrics(0)
          $height = [UiTestDisplay]::GetSystemMetrics(1)
          $report = "before=$before`nafter=${width}x${height}`nattempts=$($attempts -join '; ')"
          Write-Host $report
          New-Item -ItemType Directory -Force -Path 'outputs\ui-smoke' | Out-Null
          $report | Set-Content -Encoding utf8 'outputs\ui-smoke\runner-display.txt'
          if ($width -lt 1440 -or $height -lt 900) {
            throw "Runner desktop ${width}x${height} cannot fit the 1280x800 client window plus borders. UI verification is blocked. $($attempts -join '; ')"
          }

      - name: Check handheld layout and capture UI
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'outputs\vestibular-joystick-sim\VestibularJoystickSim.exe'
          $screenshots = Join-Path $PWD 'outputs\ui-smoke'
          New-Item -ItemType Directory -Force -Path $screenshots | Out-Null
          $test = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test', $screenshots -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "UI smoke test failed: $($test.ExitCode)" }

      - name: Package executable, runtime dependency and instructions
        shell: pwsh
        run: |
          $name = 'VFORCE-Purple-NRF-2026.10.27'
          $package = Join-Path $PWD "outputs\$name"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'outputs\vestibular-joystick-sim\VestibularJoystickSim.exe' $package
          Copy-Item 'outputs\vestibular-joystick-sim\SimConnect.dll' $package
          Copy-Item README.md (Join-Path $package 'READ-ME-FIRST.md')
          "source_commit=$env:GITHUB_SHA`nworkflow_run=$env:GITHUB_RUN_ID`nfirmware_target=vmocion-classic-firmware/v0.8.1`nfirmware_modified=false" |
            Set-Content -Encoding utf8 (Join-Path $package 'BUILD-INFO.txt')
          Get-ChildItem -LiteralPath $package -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $package 'SHA256SUMS.txt')
          Compress-Archive -Path "$package\*" -DestinationPath "outputs\$name.zip" -Force

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: VFORCE-Purple-NRF-2026.10.27
          if-no-files-found: error
          path: |
            outputs/VFORCE-Purple-NRF-2026.10.27.zip
            outputs/VFORCE-Purple-NRF-2026.10.27/

      - name: Upload UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VFORCE-Purple-NRF-UI-check
          if-no-files-found: warn
          path: outputs/ui-smoke/
