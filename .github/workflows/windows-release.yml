name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and self-test
        shell: pwsh
        run: .\build.ps1

      - name: Package download
        shell: pwsh
        run: |
          $packageDir = "outputs\VestibularJoystickSim-windows"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "outputs\vestibular-joystick-sim\VestibularJoystickSim.exe" $packageDir -Force
          Copy-Item "outputs\vestibular-joystick-sim\SimConnect.dll" $packageDir -Force
          Compress-Archive -Path "$packageDir\*" -DestinationPath "outputs\VestibularJoystickSim-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VestibularJoystickSim-windows
          path: outputs/VestibularJoystickSim-windows.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "outputs\VestibularJoystickSim-windows.zip" `
            "outputs\vestibular-joystick-sim\VestibularJoystickSim.exe" `
            --title "Vestibular Joystick Sim $tag" `
            --notes "Windows build with Peak mA control from 0.00 to 2.50 mA. Download the ZIP for the executable plus SimConnect.dll." `
            --latest
